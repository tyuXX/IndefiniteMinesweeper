<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indefinite Minesweeper</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>

<body>
    <div id="game">
        <canvas id="canvas"></canvas>
        <div id="ui-layer">
            <div id="header">
                <div id="stats">
                    <div class="stat-box">
                        <span class="stat-label">Flagged</span>
                        <span class="stat-value" id="mines">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Explored</span>
                        <span class="stat-value" id="explored">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Lives</span>
                        <span class="stat-value" id="lives">3</span>
                    </div>
                </div>
            </div>

            <div id="controls">
                <button id="recenterBtn" title="Recenter">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19 12h2"></path>
                        <path d="M3 12h2"></path>
                        <path d="M12 3v2"></path>
                        <path d="M12 19v2"></path>
                    </svg>
                </button>
                <button id="suicideBtn" title="Suicide">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v2"></path>
                        <path d="M12 19v2"></path>
                        <path d="M12 12v2"></path>
                        <path d="M12 6v2"></path>
                    </svg>
                </button>
            </div>

            <div id="game-over" class="hidden glass-panel">
                <h2 id="game-over-title">Game Over!</h2>
                <p>You hit a mine.</p>
                <button id="newGameBtn" class="primary-btn">Start New Game</button>
            </div>
        </div>
    </div>
    <script src="js/grid.js"></script>
    <script src="js/script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }).catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
