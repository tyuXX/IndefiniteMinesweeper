<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Indefinite Minesweeper</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
</head>

<body>
    <div id="game">
        <canvas id="canvas"></canvas>
        <div id="ui-layer">
            <div id="header">
                <div id="stats">
                    <div class="stat-box">
                        <span class="stat-label">Flagged</span>
                        <span class="stat-value" id="mines">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Explored</span>
                        <span class="stat-value" id="explored">0</span>
                    </div>
                    <div class="stat-box">
                        <span class="stat-label">Lives</span>
                        <span class="stat-value" id="lives">3</span>
                    </div>
                </div>
            </div>

            <div id="controls">
                <button id="flagBtn" title="Flag Mode">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
                        <line x1="4" y1="22" x2="4" y2="15"></line>
                    </svg>
                </button>
                <button id="zoomInBtn" title="Zoom In">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button id="zoomOutBtn" title="Zoom Out">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
                <button id="recenterBtn" title="Recenter">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path d="M19 12h2"></path>
                        <path d="M3 12h2"></path>
                        <path d="M12 3v2"></path>
                        <path d="M12 19v2"></path>
                    </svg>
                </button>
                <button id="waypointsBtn" title="Waypoints">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="10" r="3"></circle>
                    </svg>
                </button>
                <button id="suicideBtn" title="Suicide">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v2"></path>
                        <path d="M12 19v2"></path>
                        <path d="M12 12v2"></path>
                        <path d="M12 6v2"></path>
                    </svg>
                </button>
            </div>

            <div id="game-over" class="hidden glass-panel">
                <h2 id="game-over-title">Game Over!</h2>
                <p>You hit a mine.</p>
                <button id="newGameBtn" class="primary-btn">Start New Game</button>
            </div>
            
            <div id="waypointsBackdrop" class="hidden modal-backdrop"></div>
            <div id="waypointsModal" class="hidden glass-panel">
                <div class="modal-header">
                    <h2>Waypoints</h2>
                    <button id="closeWaypointsBtn" class="close-btn">&times;</button>
                </div>
                <div class="modal-content">
                    <div class="waypoint-controls">
                        <button id="addWaypointBtn" class="primary-btn">Add Current Position</button>
                    </div>
                    <div id="waypointsList" class="waypoints-list">
                        <!-- Waypoints will be dynamically added here -->
                    </div>
                </div>
            </div>
        </div>
        <div id="commit-hash">
            <a id="commit-hash-btn" href="https://github.com/tyuxx/indefinite-minesweeper/commit/">pending...</a>
        </div>
    </div>
    <script src="js/grid.js"></script>
    <script src="js/script.js"></script>
    <script src="js/v.js" defer></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(registration => {
                    console.log('ServiceWorker registration successful with scope: ', registration.scope);
                }).catch(err => {
                    console.error('ServiceWorker registration failed: ', err);
                });
            });
        }
    </script>
</body>

</html>
